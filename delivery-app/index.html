<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>출하 배차 확인</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #111; --sub: #555; --line: #d0d5db;
    --pri: #1f4e79; --ok: #1b7f3b; --warn: #c25e00; --bad: #c62828; --muted: #8a939c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  header { background: var(--pri); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 21px; margin: 0; flex: 1; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 16px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card.done { opacity: .6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .sub { color: var(--sub); font-size: 17px; }
  .big { font-size: 24px; font-weight: 700; }
  .plate { font-size: 34px; font-weight: 800; letter-spacing: 1px; background: #fff7d6; border: 3px solid #222; border-radius: 10px; padding: 4px 14px; display: inline-block; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; }
  .b-배차대기 { background: var(--muted); } .b-승인대기 { background: var(--warn); } .b-승인완료 { background: var(--pri); }
  .b-반려 { background: var(--bad); } .b-상차완료 { background: var(--ok); } .b-취소 { background: #444; }
  .btn { display: block; width: 100%; min-height: 58px; border: 0; border-radius: 12px; font-size: 20px; font-weight: 700; padding: 12px; margin-top: 10px; color: #fff; background: var(--pri); text-align: center; text-decoration: none; cursor: pointer; }
  .btn.ok { background: var(--ok); } .btn.bad { background: var(--bad); } .btn.warn { background: var(--warn); }
  .btn.ghost { background: #fff; color: var(--pri); border: 2px solid var(--pri); }
  .btn.kakao { background: #fee500; color: #191919; }
  .btn:disabled { opacity: .5; }
  .btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .role { min-height: 96px; font-size: 24px; }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; font-size: 20px; padding: 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--pri); }
  .item { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; }
  .item .g3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; margin-top: 6px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .tabs button { flex: none; border: 2px solid var(--pri); background: #fff; color: var(--pri); border-radius: 99px; padding: 8px 14px; font-size: 17px; font-weight: 700; }
  .tabs button.on { background: var(--pri); color: #fff; }
  .items { margin: 8px 0 0; padding: 0; list-style: none; }
  .items li { padding: 6px 0; border-top: 1px solid #eee; display: flex; justify-content: space-between; gap: 8px; }
  .items li b { white-space: nowrap; }
  .notice { background: #fff4e5; border: 2px solid var(--warn); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 17px; }
  .notice.red { background: #fdecea; border-color: var(--bad); }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .pinbox { font-size: 40px; letter-spacing: 14px; text-align: center; padding: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .pad button { min-height: 70px; font-size: 30px; font-weight: 700; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 24px; max-width: 560px; margin: 0 auto; background: #222; color: #fff; padding: 16px; border-radius: 12px; font-size: 18px; text-align: center; display: none; z-index: 20; }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; z-index: 15; }
  /* 거래명세표 */
  .stmt h2 { text-align: center; letter-spacing: 8px; margin: 4px 0 12px; }
  .stmt table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .stmt th, .stmt td { border: 1px solid #333; padding: 6px; }
  .stmt th { background: #eef2f6; white-space: nowrap; }
  .stmt td:first-child { min-width: 90px; }
  .stmt td.n { text-align: right; white-space: nowrap; }
  .stmt .info td { width: 50%; vertical-align: top; }
  .tblwrap { overflow-x: auto; }
  @media print {
    header, .noprint, #toast { display: none !important; }
    body { background: #fff; } main { padding: 0; } .card { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header class="noprint">
  <h1 id="title">출하 배차 확인</h1>
  <button id="btnRefresh" style="display:none" onclick="refresh(true)">새로고침</button>
  <button id="btnOut" style="display:none" onclick="logout()">나가기</button>
</header>
<main id="app"></main>
<div id="busy">잠시만 기다려 주세요…</div>
<div id="toast"></div>

<script>
/* ===================== 설정 =====================
 * Apps Script 배포 후 받은 "웹 앱 URL"을 아래 따옴표 안에 붙여 넣으세요.
 * (README.md 의 3단계 참고)
 */
var API_URL = 'https://script.google.com/macros/s/여기에_웹앱_ID/exec';
/* =============================================== */

var ROLE_NAME = { company: '회사(관리)', carrier: '운송사', loader: '창고 상차' };
var S = { role: null, pin: null, rows: [], cfg: {}, tab: null, cachedAt: null, offline: false };
var $app = document.getElementById('app');

function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
function today() {
  var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function dayLabel(s) {
  var t = new Date(today() + 'T00:00:00'), d = new Date(s + 'T00:00:00');
  var diff = Math.round((d - t) / 86400000);
  var w = '일월화수목금토'[d.getDay()] || '';
  var tag = diff === 0 ? ' (오늘)' : diff === 1 ? ' (내일)' : diff === -1 ? ' (어제)' : '';
  return String(s).slice(5).replace('-', '/') + ' ' + w + tag;
}
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2500);
}
function busy(on) { document.getElementById('busy').style.display = on ? 'flex' : 'none'; }
function phoneFmt(p) {
  p = String(p || '').replace(/[^0-9]/g, '');
  return p.length === 11 ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : p.length === 10 ? p.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3') : p;
}

function api(action, extra) {
  var body = Object.assign({ action: action, pin: S.pin, role: S.role }, extra || {});
  // Content-Type 을 지정하지 않아야(text/plain) 브라우저가 Apps Script 로 바로 보낼 수 있음
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) { var e = new Error(j.msg || '오류가 발생했습니다.'); e.server = true; throw e; } return j; });
}
function act(action, extra, okMsg) {
  busy(true);
  return api(action, extra).then(function () {
    busy(false); if (okMsg) toast(okMsg); return refresh();
  }).catch(function (e) {
    busy(false);
    alert(e.server ? e.message : '인터넷 연결이 약합니다.\n신호가 잡히는 곳에서 다시 눌러 주세요.');
    throw e;
  });
}

/* ===================== 시작 / 로그인 ===================== */
function home() {
  setHeader('출하 배차 확인', false);
  $app.innerHTML =
    '<p class="big" style="text-align:center;margin:16px 0 20px">누구신가요?</p>' +
    '<button class="btn role" onclick="pinScreen(\'carrier\')">🚚 운송사</button>' +
    '<button class="btn role ok" onclick="pinScreen(\'loader\')">📦 창고 상차 담당</button>' +
    '<button class="btn role ghost" onclick="pinScreen(\'company\')">🏢 회사(관리)</button>';
}
function pinScreen(role) {
  var pin = '';
  setHeader(ROLE_NAME[role] + ' 들어가기', false);
  function draw() {
    $app.innerHTML =
      '<div class="card"><p style="margin:0;text-align:center">비밀번호를 눌러 주세요</p>' +
      '<div class="pinbox">' + (pin ? pin.replace(/./g, '●') : '&nbsp;') + '</div>' +
      '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button data-n="' + n + '">' + n + '</button>'; }).join('') +
      '<button data-n="del">지움</button><button data-n="0">0</button><button data-n="go" style="background:var(--pri);color:#fff">확인</button></div></div>' +
      '<button class="btn ghost" onclick="home()">처음으로</button>';
    $app.querySelectorAll('.pad button').forEach(function (b) {
      b.onclick = function () {
        var n = b.getAttribute('data-n');
        if (n === 'del') pin = pin.slice(0, -1);
        else if (n === 'go') return login(role, pin);
        else if (pin.length < 8) pin += n;
        draw();
      };
    });
  }
  draw();
}
function login(role, pin) {
  if (!pin) return;
  S.role = role; S.pin = pin;
  busy(true);
  api('login').then(function () {
    busy(false);
    ls('dl_role', role); ls('dl_pin', pin);
    S.tab = null; refresh(true);
  }).catch(function (e) {
    busy(false); S.role = S.pin = null;
    alert(e.server ? e.message : '인터넷 연결을 확인해 주세요.');
    pinScreen(role);
  });
}
function logout() {
  if (!confirm('나가시겠습니까?\n다음에 다시 비밀번호를 눌러야 합니다.')) return;
  ls('dl_role', null); ls('dl_pin', null);
  S.role = S.pin = null; home();
}
function setHeader(t, inApp) {
  document.getElementById('title').textContent = t;
  document.getElementById('btnRefresh').style.display = inApp ? '' : 'none';
  document.getElementById('btnOut').style.display = inApp ? '' : 'none';
}

/* ===================== 목록 불러오기 ===================== */
function refresh(showBusy) {
  if (showBusy) busy(true);
  return api('list').then(function (j) {
    busy(false);
    S.rows = j.rows; S.cfg = j.cfg || {}; S.offline = false; S.cachedAt = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    ls('dl_cache_' + S.role, JSON.stringify({ rows: S.rows, cfg: S.cfg, at: S.cachedAt }));
    render();
  }).catch(function (e) {
    busy(false);
    if (e.server) { alert(e.message); ls('dl_pin', null); home(); return; }
    // 신호가 약할 때: 마지막으로 받은 목록을 보여줌
    var c = null; try { c = JSON.parse(ls('dl_cache_' + S.role) || 'null'); } catch (x) {}
    if (c) { S.rows = c.rows; S.cfg = c.cfg || {}; S.cachedAt = c.at; }
    S.offline = true; render();
  });
}
function offlineNote() {
  return S.offline ? '<div class="notice red">📶 인터넷 연결이 약합니다. ' + (S.cachedAt ? S.cachedAt + '에 받은 목록을 보여드립니다.' : '') + '<br>신호가 잡히면 위의 [새로고침]을 눌러 주세요.</div>' : '';
}
function render() {
  setHeader(ROLE_NAME[S.role], true);
  if (S.role === 'company') renderCompany();
  else if (S.role === 'carrier') renderCarrier();
  else renderLoader();
}
function itemsHtml(r, withPrice) {
  return '<ul class="items">' + (r['품목'] || []).map(function (it) {
    return '<li><span>' + esc(it.품명) + (it.규격 ? ' <span class="sub">' + esc(it.규격) + '</span>' : '') + '</span><b>' +
      won(it.수량) + ' ' + esc(it.단위) + (withPrice && it.금액 ? ' · ' + won(it.금액) + '원' : '') + '</b></li>';
  }).join('') + '</ul>';
}
function driverHtml(r) {
  if (!r['차량번호']) return '';
  return '<div style="margin-top:10px"><span class="plate" style="font-size:24px">' + esc(r['차량번호']) + '</span></div>' +
    '<div class="sub" style="margin-top:6px">' + esc(r['운송사'] || '') + ' · 기사 ' + esc(r['기사명']) + ' · ' + esc(phoneFmt(r['기사전화'])) + (r['차종'] ? ' · ' + esc(r['차종']) : '') + '</div>' +
    (r['운송사메모'] ? '<div class="sub">메모: ' + esc(r['운송사메모']) + '</div>' : '');
}
function headHtml(r) {
  return '<div class="row"><span class="big grow">' + esc(dayLabel(r['출하일'])) + '</span><span class="badge b-' + esc(r['상태']) + '">' + esc(r['상태']) + '</span></div>' +
    '<div style="font-size:21px;font-weight:700;margin-top:4px">' + esc(r['거래처']) + '</div>' +
    (r['도착지'] ? '<div class="sub">📍 ' + esc(r['도착지']) + (r['도착지연락처'] ? ' · ☎ ' + esc(phoneFmt(r['도착지연락처'])) : '') + '</div>' : '') +
    (r['요청메모'] ? '<div class="sub">요청: ' + esc(r['요청메모']) + '</div>' : '');
}
function tabs(defs) {
  if (!S.tab || !defs.some(function (d) { return d[0] === S.tab; })) S.tab = defs[0][0];
  return '<div class="tabs noprint">' + defs.map(function (d) {
    return '<button class="' + (S.tab === d[0] ? 'on' : '') + '" onclick="S.tab=\'' + d[0] + '\';render()">' + d[1] + '</button>';
  }).join('') + '</div>';
}
function byId(id) { return S.rows.filter(function (r) { return r['ID'] === id; })[0]; }
function stmtUrl(r) { return location.origin + location.pathname + '?s=' + encodeURIComponent(r['ID']) + '&t=' + encodeURIComponent(r['토큰']); }

/* ===================== 회사(관리) ===================== */
function renderCompany() {
  var cnt = function (st) { return S.rows.filter(function (r) { return r['상태'] === st; }).length; };
  var defs = [['승인대기', '승인대기 ' + cnt('승인대기')], ['배차대기', '배차대기·반려 ' + (cnt('배차대기') + cnt('반려'))],
    ['승인완료', '승인완료 ' + cnt('승인완료')], ['상차완료', '상차완료'], ['전체', '전체']];
  var html = offlineNote() + '<button class="btn ok" onclick="shipForm()">＋ 출하 등록</button><div style="height:12px"></div>' + tabs(defs);
  var list = S.rows.filter(function (r) {
    if (S.tab === '전체') return true;
    if (S.tab === '배차대기') return r['상태'] === '배차대기' || r['상태'] === '반려';
    return r['상태'] === S.tab;
  });
  if (S.tab === '상차완료' || S.tab === '전체') list = list.slice().reverse();
  html += list.length ? list.map(function (r) {
    var id = esc(r['ID']), b = '';
    if (r['상태'] === '승인대기') b += '<div class="btns2"><button class="btn ok" onclick="approve(\'' + id + '\')">✔ 승인</button><button class="btn bad" onclick="reject(\'' + id + '\')">반려</button></div>';
    if (r['상태'] === '승인완료') b += '<button class="btn bad" onclick="reject(\'' + id + '\')">승인 취소 (다시 배차 요청)</button>';
    if (r['상태'] !== '상차완료' && r['상태'] !== '취소') b += '<div class="btns2"><button class="btn ghost" onclick="shipForm(\'' + id + '\')">수정</button><button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" onclick="cancelShip(\'' + id + '\')">출하 취소</button></div>';
    if (r['상태'] !== '취소') b += '<a class="btn ghost" href="' + esc(stmtUrl(r)) + '" target="_blank">거래명세표 보기</a>';
    var extra = '';
    if (r['반려사유'] && r['상태'] === '반려') extra += '<div class="notice red" style="margin:8px 0 0">반려 사유: ' + esc(r['반려사유']) + '</div>';
    if (r['상차시각']) extra += '<div class="sub" style="margin-top:6px">상차완료 ' + esc(r['상차시각']) + (r['상차확인자'] ? ' (' + esc(r['상차확인자']) + ')' : '') + (r['명세표발송시각'] ? ' · 명세표 발송 ' + esc(String(r['명세표발송시각']).slice(11)) : '') + '</div>';
    return '<div class="card' + (r['상태'] === '취소' ? ' done' : '') + '">' + headHtml(r) + itemsHtml(r, true) +
      (r['합계'] ? '<div style="text-align:right;font-weight:700">합계 ' + won(r['합계']) + '원</div>' : '') +
      driverHtml(r) + extra + b + '</div>';
  }).join('') : '<div class="empty">해당하는 출하 건이 없습니다.</div>';
  $app.innerHTML = html;
}
function approve(id) {
  var r = byId(id);
  if (!confirm('승인하시겠습니까?\n\n' + r['거래처'] + '\n차량 ' + r['차량번호'] + ' / 기사 ' + r['기사명'])) return;
  act('approve', { id: id }, '승인했습니다. 창고에서 확인할 수 있습니다.');
}
function reject(id) {
  var why = prompt('반려 사유를 적어 주세요 (운송사에 보입니다)', '');
  if (why === null) return;
  act('reject', { id: id, data: { 사유: why } }, '반려했습니다.');
}
function cancelShip(id) {
  if (!confirm('이 출하 건을 취소하시겠습니까?')) return;
  act('cancel', { id: id }, '취소했습니다.');
}
function itemRow(it) {
  it = it || {};
  return '<div class="item"><input placeholder="품명 (예: 토양개량제)" class="f-name" value="' + esc(it.품명) + '">' +
    '<div class="g3"><input placeholder="규격 (20kg)" class="f-spec" value="' + esc(it.규격) + '">' +
    '<input placeholder="수량" class="f-qty" inputmode="numeric" value="' + esc(it.수량 || '') + '">' +
    '<input placeholder="단위" class="f-unit" value="' + esc(it.단위 || '포') + '"></div>' +
    '<div class="row" style="margin-top:6px"><input placeholder="단가 (원, 선택)" class="f-price grow" inputmode="numeric" style="width:auto" value="' + esc(it.단가 || '') + '">' +
    '<button type="button" class="tabs-x" style="font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff" onclick="this.closest(\'.item\').remove()">삭제</button></div></div>';
}
function shipForm(id) {
  var r = id ? byId(id) : { 출하일: today(), 품목: [{}] };
  setHeader(id ? '출하 수정' : '출하 등록', true);
  $app.innerHTML = '<div class="card">' +
    '<label>출하일</label><input type="date" id="f_date" value="' + esc(r['출하일']) + '">' +
    '<label>거래처 (받는 곳)</label><input id="f_cust" value="' + esc(r['거래처']) + '" placeholder="예: OO농협">' +
    '<label>도착지 주소</label><input id="f_addr" value="' + esc(r['도착지']) + '">' +
    '<label>도착지 연락처</label><input id="f_tel" inputmode="tel" value="' + esc(r['도착지연락처']) + '">' +
    '<label>품목</label><div id="f_items">' + (r['품목'] || [{}]).map(itemRow).join('') + '</div>' +
    '<button type="button" class="btn ghost" onclick="document.getElementById(\'f_items\').insertAdjacentHTML(\'beforeend\', itemRow())">＋ 품목 추가</button>' +
    '<label>운송사·창고에 전할 말 (선택)</label><textarea id="f_memo" rows="2">' + esc(r['요청메모']) + '</textarea>' +
    '<button class="btn ok" onclick="saveShip(' + (id ? '\'' + esc(id) + '\'' : '') + ')">저장</button>' +
    '<button class="btn ghost" onclick="render()">돌아가기</button></div>';
}
function saveShip(id) {
  var items = [].map.call(document.querySelectorAll('#f_items .item'), function (el) {
    return {
      품명: el.querySelector('.f-name').value, 규격: el.querySelector('.f-spec').value,
      수량: el.querySelector('.f-qty').value.replace(/[^0-9.]/g, ''), 단위: el.querySelector('.f-unit').value,
      단가: el.querySelector('.f-price').value.replace(/[^0-9.]/g, '')
    };
  });
  var data = {
    출하일: document.getElementById('f_date').value, 거래처: document.getElementById('f_cust').value,
    도착지: document.getElementById('f_addr').value, 도착지연락처: document.getElementById('f_tel').value,
    요청메모: document.getElementById('f_memo').value, 품목: items
  };
  act(id ? 'edit' : 'create', { id: id, data: data }, '저장했습니다. 운송사가 배차를 입력할 수 있습니다.')
    .then(function () { S.tab = '배차대기'; render(); }).catch(function () {});
}

/* ===================== 운송사 ===================== */
function renderCarrier() {
  var todo = S.rows.filter(function (r) { return r['상태'] === '배차대기' || r['상태'] === '반려'; });
  var rest = S.rows.filter(function (r) { return r['상태'] !== '배차대기' && r['상태'] !== '반려'; });
  var html = offlineNote();
  html += '<p class="big" style="margin:4px 0 10px">배차 입력이 필요한 건 (' + todo.length + ')</p>';
  html += todo.length ? todo.map(function (r) {
    return '<div class="card">' + headHtml(r) + itemsHtml(r) +
      (r['상태'] === '반려' ? '<div class="notice red" style="margin:8px 0 0">회사에서 반려했습니다: ' + esc(r['반려사유']) + '<br>기사·차량을 다시 입력해 주세요.</div>' + driverHtml(r) : '') +
      '<button class="btn warn" onclick="assignForm(\'' + esc(r['ID']) + '\')">🚚 기사·차량 입력하기</button></div>';
  }).join('') : '<div class="empty" style="padding:20px">지금은 입력할 건이 없습니다.</div>';
  html += '<p class="big" style="margin:24px 0 10px">입력한 건</p>';
  html += rest.length ? rest.map(function (r) {
    var msg = r['상태'] === '승인대기' ? '<div class="notice" style="margin:10px 0 0">회사 승인을 기다리고 있습니다.</div><button class="btn ghost" onclick="assignForm(\'' + esc(r['ID']) + '\')">기사·차량 고치기</button>'
      : r['상태'] === '승인완료' ? '<div class="notice" style="margin:10px 0 0;background:#e8f5e9;border-color:var(--ok)">✔ 승인되었습니다. 기사님께 창고로 출발하라고 알려 주세요.' + (S.cfg['창고주소'] ? '<br>창고: ' + esc(S.cfg['창고주소']) : '') + '</div>'
      : '';
    return '<div class="card' + (r['상태'] === '상차완료' ? ' done' : '') + '">' + headHtml(r) + driverHtml(r) + msg + '</div>';
  }).join('') : '<div class="empty" style="padding:20px">없음</div>';
  $app.innerHTML = html;
}
function assignForm(id) {
  var r = byId(id);
  setHeader('기사·차량 입력', true);
  var cars = ['1톤', '2.5톤', '3.5톤', '5톤', '11톤', '25톤', '기타'];
  $app.innerHTML = '<div class="card">' + headHtml(r) + itemsHtml(r) + '</div><div class="card">' +
    '<label>운송사 이름</label><input id="a_co" value="' + esc(r['운송사'] || ls('dl_carrier') || '') + '">' +
    '<label>기사님 이름</label><input id="a_name" value="' + esc(r['기사명']) + '">' +
    '<label>기사님 휴대폰 번호</label><input id="a_tel" inputmode="tel" placeholder="010-0000-0000" value="' + esc(phoneFmt(r['기사전화'])) + '">' +
    '<label>차량번호</label><input id="a_plate" placeholder="예: 12가3456" value="' + esc(r['차량번호']) + '">' +
    '<label>차종</label><select id="a_car"><option value="">선택</option>' + cars.map(function (c) { return '<option' + (r['차종'] === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
    '<label>메모 (도착 예정 시간 등)</label><input id="a_memo" value="' + esc(r['운송사메모']) + '">' +
    '<button class="btn ok" onclick="saveAssign(\'' + esc(id) + '\')">회사에 승인 요청</button>' +
    '<button class="btn ghost" onclick="render()">돌아가기</button></div>';
}
function saveAssign(id) {
  var g = function (k) { return document.getElementById(k).value.trim(); };
  var data = { 운송사: g('a_co'), 기사명: g('a_name'), 기사전화: g('a_tel'), 차량번호: g('a_plate'), 차종: g('a_car'), 운송사메모: g('a_memo') };
  if (!data.기사명 || !data.기사전화 || !data.차량번호) return alert('기사님 이름, 전화번호, 차량번호를 모두 입력해 주세요.');
  ls('dl_carrier', data.운송사);
  act('assign', { id: id, data: data }, '승인 요청을 보냈습니다.').catch(function () {});
}

/* ===================== 창고 상차 담당 ===================== */
function renderLoader() {
  var wait = S.rows.filter(function (r) { return r['상태'] === '승인완료'; });
  var done = S.rows.filter(function (r) { return r['상태'] === '상차완료'; }).reverse();
  var html = offlineNote();
  html += '<p class="big" style="margin:4px 0 10px">상차할 차량 (' + wait.length + ')</p>';
  html += wait.length ? wait.map(loaderCard).join('') : '<div class="empty" style="padding:20px">승인된 차량이 없습니다.</div>';
  if (done.length) html += '<p class="big" style="margin:24px 0 10px">상차 끝난 차량</p>' + done.map(loaderCard).join('');
  $app.innerHTML = html;
}
function loaderCard(r) {
  var id = esc(r['ID']), fin = r['상태'] === '상차완료';
  return '<div class="card' + (fin ? ' done' : '') + '">' +
    '<div class="row"><span class="big grow">' + esc(dayLabel(r['출하일'])) + '</span><span class="badge b-' + esc(r['상태']) + '">' + esc(r['상태']) + '</span></div>' +
    '<div style="margin:10px 0"><span class="plate">' + esc(r['차량번호']) + '</span></div>' +
    '<div style="font-size:20px">기사 <b>' + esc(r['기사명']) + '</b> · ' + esc(phoneFmt(r['기사전화'])) + (r['차종'] ? ' · ' + esc(r['차종']) : '') + '</div>' +
    '<div style="font-size:20px;margin-top:6px">→ <b>' + esc(r['거래처']) + '</b></div>' +
    (r['요청메모'] ? '<div class="sub">요청: ' + esc(r['요청메모']) + '</div>' : '') +
    itemsHtml(r) +
    (fin ? '<div class="sub" style="margin-top:6px">상차완료 ' + esc(r['상차시각']) + (r['명세표발송시각'] ? ' · 명세표 보냄' : ' · <b style="color:var(--bad)">명세표 아직 안 보냄</b>') + '</div>' : '') +
    '<a class="btn ghost" href="tel:' + esc(r['기사전화']) + '">📞 기사님께 전화</a>' +
    '<div class="btns2"><button class="btn" onclick="sendSms(\'' + id + '\')">💬 문자 보내기</button><button class="btn kakao" onclick="sendKakao(\'' + id + '\')">카카오톡으로</button></div>' +
    (fin ? '' : '<button class="btn ok" style="min-height:72px;font-size:24px" onclick="loaded(\'' + id + '\')">✔ 상차 완료</button>') +
    '</div>';
}
function msgText(r) {
  var it = (r['품목'] || []).map(function (x) { return '- ' + x.품명 + (x.규격 ? ' ' + x.규격 : '') + ' ' + won(x.수량) + (x.단위 || ''); }).join('\n');
  return '[' + (S.cfg['상호'] || '') + '] 거래명세표\n' +
    '출하일: ' + r['출하일'] + '\n거래처: ' + r['거래처'] + '\n' +
    (r['도착지'] ? '도착지: ' + r['도착지'] + '\n' : '') +
    (r['도착지연락처'] ? '도착지 연락처: ' + phoneFmt(r['도착지연락처']) + '\n' : '') +
    '차량: ' + r['차량번호'] + '\n품목:\n' + it + '\n\n명세표 보기:\n' + stmtUrl(r);
}
function markSent(id) { api('sent', { id: id }).catch(function () {}); }
function sendSms(id) {
  var r = byId(id);
  // 안드로이드·아이폰 모두 동작하는 형식
  markSent(id);
  location.href = 'sms:' + String(r['기사전화']).replace(/[^0-9]/g, '') + '?&body=' + encodeURIComponent(msgText(r));
}
function sendKakao(id) {
  var r = byId(id), text = msgText(r);
  if (navigator.share) {
    navigator.share({ title: '거래명세표', text: text }).then(function () { markSent(id); }).catch(function () {});
    toast('목록에서 "카카오톡"을 고른 뒤 기사님을 선택해 주세요.', 4000);
    return;
  }
  var done = function () { markSent(id); alert('내용을 복사했습니다.\n카카오톡에서 기사님 대화방에 "붙여넣기" 해 주세요.'); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { prompt('아래 내용을 길게 눌러 복사해 주세요', text); });
  else prompt('아래 내용을 길게 눌러 복사해 주세요', text);
}
function loaded(id) {
  var r = byId(id);
  if (!confirm('차량번호를 확인해 주세요.\n\n' + r['차량번호'] + '\n\n이 차량이 맞고 상차를 마쳤습니까?')) return;
  var who = ls('dl_loader_name') || prompt('확인하신 분의 이름을 적어 주세요 (처음 한 번만)', '') || '';
  if (who) ls('dl_loader_name', who);
  act('loaded', { id: id, data: { 확인자: who } }, '상차 완료로 기록했습니다.').then(function () {
    if (!r['명세표발송시각'] && confirm('기사님께 거래명세표 문자를 보낼까요?')) sendSms(id);
  }).catch(function () {});
}

/* ===================== 거래명세표 (기사님이 여는 화면) ===================== */
function showStatement(id, t) {
  setHeader('거래명세표', false);
  $app.innerHTML = '<div class="empty">불러오는 중…</div>';
  fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'statement', id: id, t: t }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) { $app.innerHTML = '<div class="empty">' + esc(j.msg) + '</div>'; return; }
      var s = j.supplier, d = j.doc, hasPrice = (d['품목'] || []).some(function (x) { return x.단가; });
      $app.innerHTML = '<div class="card stmt"><h2>거 래 명 세 표</h2>' +
        '<div class="row sub" style="justify-content:space-between;margin-bottom:8px"><span>일자: ' + esc(d['출하일']) + '</span><span>No. ' + esc(d['ID']) + '</span></div>' +
        '<div class="tblwrap"><table class="info"><tr><th colspan="1">공급자</th><th>공급받는자</th></tr><tr>' +
        '<td><b>' + esc(s['상호']) + '</b><br>대표 ' + esc(s['대표자']) + '<br>사업자 ' + esc(s['사업자번호']) + '<br>' + esc(s['주소']) + '<br>☎ ' + esc(s['전화']) + '</td>' +
        '<td><b>' + esc(d['거래처']) + '</b>' + (d['도착지'] ? '<br>' + esc(d['도착지']) : '') + (d['도착지연락처'] ? '<br>☎ ' + esc(phoneFmt(d['도착지연락처'])) : '') + '</td></tr></table></div>' +
        '<div class="tblwrap" style="margin-top:10px"><table><tr><th>품명</th><th>규격</th><th>수량</th>' + (hasPrice ? '<th>단가</th><th>금액</th>' : '') + '</tr>' +
        (d['품목'] || []).map(function (x) {
          return '<tr><td>' + esc(x.품명) + '</td><td>' + esc(x.규격) + '</td><td class="n">' + won(x.수량) + ' ' + esc(x.단위) + '</td>' +
            (hasPrice ? '<td class="n">' + won(x.단가) + '</td><td class="n">' + won(x.금액) + '</td>' : '') + '</tr>';
        }).join('') +
        (hasPrice ? '<tr><th colspan="4">합계</th><td class="n"><b>' + won(d['합계']) + '</b></td></tr>' : '') + '</table></div>' +
        '<p class="sub">운송: ' + esc(d['차량번호']) + ' / 기사 ' + esc(d['기사명']) + '</p>' +
        '<p style="margin-top:30px;text-align:right">인수자: ____________________ (인)</p></div>' +
        '<button class="btn ghost noprint" onclick="print()">인쇄 / PDF 저장</button>';
    })
    .catch(function () { $app.innerHTML = '<div class="empty">인터넷 연결을 확인한 뒤 다시 열어 주세요.<br><br><button class="btn" onclick="location.reload()">다시 열기</button></div>'; });
}

/* ===================== 시작 ===================== */
(function start() {
  var q = new URLSearchParams(location.search);
  if (q.get('s')) return showStatement(q.get('s'), q.get('t'));
  if (API_URL.indexOf('여기에') >= 0) {
    $app.innerHTML = '<div class="notice red">설치가 아직 끝나지 않았습니다.<br>index.html 의 API_URL 에 Apps Script 웹 앱 주소를 넣어 주세요. (README.md 3단계)</div>';
    return;
  }
  S.role = ls('dl_role'); S.pin = ls('dl_pin');
  if (S.role && S.pin) refresh(true); else home();
  // 화면을 켜 둔 동안 1분마다 자동 새로고침
  setInterval(function () { if (S.pin && !document.hidden && !document.getElementById('f_items') && !document.getElementById('a_name')) refresh(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.pin && !document.getElementById('f_items') && !document.getElementById('a_name')) refresh(); });
})();
</script>
</body>
</html>
